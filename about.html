<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-image: url("kape.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 30px 10px;
            color: white;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: white;
            background: #9C5907;
            padding: 17px 24px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 28px;
            display: inline-block;
        }

        nav a:hover {
            background: #754306;
            color: white;
        }

        /* Main Content */
        .container {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px black;
        }

        p {
            font-size: 25px;
            font-weight: bold;
            text-shadow: 1px 1px 4px black;
        }

        /* Responsive Design */
        @media screen and (max-width: 600px) {
            body {
                background-attachment: scroll;
            }

            nav {
                gap: 8px;
                padding: 15px 5px;
            }

            nav a {
                padding: 10px 14px;
                font-size: 16px;
                border-radius: 10px;
            }

            .container {
                height: auto;
                min-height: 80vh;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 16px;
                margin-bottom: 5px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="homepage.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="productss.html">Product</a>
    </nav>

    <div class="container">
        <h1>WELCOME To Omad's Coffee shop</h1>
        <p>Welcome to our little coffee shop, where great coffee meets cozy vibes.</p>
        <p>We're here to serve you freshly brewed coffee, delicious treats, and</p>
        <p>a relaxing space to unwind. Come in, take a break, and enjoy every sip!</p>
    </div>

</body>
</html>

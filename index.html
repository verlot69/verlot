<!DOCTYPE html>
<html>
<head>
<title> COFFEE SHOP</title> 
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
h2 {
  font-size: 70px;
  margin: 0;
  padding: 0;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  display: flex;
}

body {
  padding: 25px;
  background: url(door.jpg);
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 20px;
}
input[type=text], input[type=password] {
  width: 80%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
  border-radius: 10px;
  font-size: 15px;
}
button {
  background-color: #9C5907;
  color: white;
  padding: 14px 22px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 80%;
  border-radius: 20px;
  font-size: 15px;
}
button:hover {
  opacity: 0.8;
}
.cancelbtn {
  width: auto;
  padding: 10px 18px;
  background-color: #9C5907;
}
.imgcontainer {
  text-align: center;
  margin: 24px 0 12px 0;
  position: relative;
}
.container {
  padding: 16px;
  color: black;
}
span.psw {
  float: right;
  padding-top: 16px;
}
.modal {
  display: none;
  position: fixed;
  z-index: 1;
  left: 0;
  top: 0;
  width: 80%;
  height: 100%;
  overflow: auto;
  background-color: rgb(0,0,0);
  background-color: rgba(0,0,0,0.4);
  padding-top: 60px;
}
.modal-content {
  background-color: pink;
  margin: 5% auto 15% auto;
  border: 1px solid #888;
  width: 15%;
  border-radius: 20px;
  background: url(kapes.gif);
  background-size: cover;
  background-position: center;
}
.close {
  position: absolute;
  right: 25px;
  top: 0;
  color: #000;
  font-size: 35px;
  font-weight: bold;
}
.close:hover,
.close:focus {
  color: white;
  cursor: pointer;
}
.animate {
  -webkit-animation: animatezoom 0.6s;
  animation: animatezoom 0.6s;
}
@-webkit-keyframes animatezoom {
  from {-webkit-transform: scale(0)}
  to {-webkit-transform: scale(1)}
}
@keyframes animatezoom {
  from {transform: scale(0)}
  to {transform: scale(1)}
}
@media screen and (max-width: 600px) {
  body {
    padding: 15px;
    background-size: cover;
    background-position: center;
    background-attachment: scroll;
  }

  h2 {
    font-size: 40px;
  }

  .modal {
    padding: 30px 10px;
  }

  .modal-content {
    width: 80%;
    margin: 10% auto;
  }

  span.psw {
    display: block;
    float: none;
  }

  .cancelbtn {
    width: 80%;
  }
}

@media screen and (min-width: 501px) and (max-width: 700px) {
  .modal-content {
    width: 60%;
  }

  h2 {
    font-size: 55px;
  }
}
</style>
</head>

<body>

<h2>Omad's Coffee shop</h2>

<button onclick="document.getElementById('id01').style.display='block'" style="width:auto;">Login</button>

<div id="id01" class="modal">

  <form class="modal-content animate" onsubmit="return validateForm()">

    <div class="imgcontainer">
      <span onclick="document.getElementById('id01').style.display='none'" class="close" title="Close Modal">&times;</span>
    </div>

    <div class="container">
      <label for="username"><b>Username</b></label>
      <input type="text" id="username" placeholder="Your Username" name="marky" required>

      <label for="password"><b>Password</b></label>
      <input type="password" id="password" placeholder="Your Password" name="1234" required>

      <button type="submit">Login</button>

      <label>
        <input type="checkbox" checked="checked" name="remember"> Remember me
      </label>
    </div>

    <div class="container" style="background-color:#f1f1f1">
      <button type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelbtn">Cancel</button>
      <span class="psw"><a href="#">Forgot Password?</a></span>
    </div>

  </form>
</div>

<script>
function validateForm() {
  var username = document.getElementById("username").value;
  var password = document.getElementById("password").value;

  var validUsername = "marky";
  var validPassword = "1234";

  if (username === validUsername && password === validPassword)
  {
    window.location.href = "homepage.html";
    return false;
  }
  else {
    alert("Invalid Username or password");
    return false;
  }
}
</script>

</body>
</html>
